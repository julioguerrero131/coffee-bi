version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-bi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    # If you have a database like MongoDB or PostgreSQL, you'd add it here
    # depends_on:
    #   - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee-bi-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Prevents overwriting container node_modules with local node_modules
      - /app/node_modules
    depends_on:
      - backend

# Optional: Add database service if needed
#   db:
#     image: mongo:latest
#     ports:
#       - "27017:27017"
#     volumes:
#       - mongodb_data:/data/db

# volumes:
#   mongodb_data:
