<div class="min-h-screen bg-white text-gray-800 flex flex-col">
  <!-- Cabecera -->
  <header class="bg-[#165034] text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Coffee BI</h1>
      <!-- Se puede agregar navegación o perfil de usuario aquí -->
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="grow container mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-6">
      <h2 class="text-xl font-semibold text-gray-700">Dashboard</h2>
      <p class="text-gray-500">Aquí se mostrarán los datos consultados desde el backend.</p>
    </div>

    <!-- Contenedores para gráficos y tablas refactorizados -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Gráfico 1 -->
      <app-dashboard-card title="Ventas por Mes">
        <div class="h-full flex items-center justify-center border-2 border-dashed border-gray-300 rounded">
          <span class="text-gray-400">Espacio para gráfico de barras</span>
        </div>
      </app-dashboard-card>
      
      <!-- Gráfico 2 -->
      <app-dashboard-card title="Productos más vendidos">
        <div class="h-full flex items-center justify-center border-2 border-dashed border-gray-300 rounded">
          <span class="text-gray-400">Espacio para gráfico circular</span>
        </div>
      </app-dashboard-card>

      <!-- Tabla -->
      <div class="lg:col-span-2">
        <app-dashboard-card title="Últimas Transacciones">
          <app-transaction-table class="w-full"></app-transaction-table>
        </app-dashboard-card>
      </div>

    </div>
  </main>
</div>
